<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Celebration</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Lobster&family=Roboto&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background-color: #001f3f;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      transition: opacity 1s ease-in-out;
      font-family: 'arial', cursive;
      color: white;
    }

    .fade-out {
      opacity: 0;
    }

    .celebration-heading {
      font-size: 3rem;
      text-align: center;
      margin-bottom: 20px;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
      font-family: Arial, Helvetica, sans-serif;
      font-weight: bold;
    }

    .celebration-image {
      max-width: 90vw;
      max-height: 70vh;
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.4);
    }
  </style>
</head>
<body>
  <h1 id="celebrationHeading" class="celebration-heading"></h1>
  <img id="celebrationImage" class="celebration-image" src="" alt="Celebration Image" />

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script>
    let celebrations = [];
    let currentIndex = 0;
    let confettiInterval;

    async function loadCelebrations() {
      try {
        const res = await fetch('/celebrations');
        celebrations = await res.json();

        // Filter out celebrations without a valid image
        celebrations = celebrations.filter(c => c.image && c.image.trim() !== '');

        if (celebrations.length === 0) {
          throw new Error('No valid celebrations with images found');
        }

        showCelebration();
        confettiInterval = setInterval(() => {
          confetti({
            particleCount: 100,
            spread: 100,
            origin: { x: Math.random(), y: Math.random() * 0.6 },
          });
        }, 400);

        setInterval(nextCelebration, 8000); // Change celebration every 8s

        setTimeout(() => {
          clearInterval(confettiInterval);
          document.body.classList.add('fade-out');
          setTimeout(() => {
            window.location.href = '/index.html';
          }, 1000);
        }, 30000); // Exit after 30s
      } catch (err) {
        console.error('Celebration failed:', err);
        // If error or no valid celebration, return to slides
        window.location.href = '/index.html';
      }
    }

    function showCelebration() {
      const { image, heading } = celebrations[currentIndex];
      document.getElementById('celebrationImage').src = image;
      document.getElementById('celebrationHeading').textContent = heading || '🎉 Celebration!';
    }

    function nextCelebration() {
      currentIndex = (currentIndex + 1) % celebrations.length;
      showCelebration();
    }

    loadCelebrations();
  </script>
</body>
</html>
