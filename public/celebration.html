<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Celebration</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Lobster&family=Roboto&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background-color: #001f3f;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      transition: opacity 1s ease-in-out;
      font-family: 'arial', cursive;
      color: white;
    }

    .fade-out {
      opacity: 0;
    }

    .celebration-heading {
      font-size: 3rem;
      text-align: center;
      margin-bottom: 20px;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
      font-family: Arial, Helvetica, sans-serif;
      font-weight: bold;
    }

    .celebration-image {
      max-width: 90vw;
      max-height: 70vh;
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.4);
    }
  </style>
</head>
<body>
  <h1 id="celebrationHeading" class="celebration-heading"></h1>
  <img id="celebrationImage" class="celebration-image" src="" alt="Celebration Image" />

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script>
  // ===== DEBUG OVERLAY =====
  (function debugOverlay(){
    const box = document.createElement('div');
    box.id = 'celebration-debug';
    box.style.cssText = 'position:fixed;top:8px;left:8px;background:rgba(0,0,0,.6);color:#0f0;font:12px/1.4 monospace;padding:8px 10px;border-radius:6px;z-index:99999;max-width:40vw;white-space:pre-wrap;';
    box.textContent = '[boot] celebration script started';
    document.body.appendChild(box);
    window.__dbg = (msg, obj) => {
      try {
        box.textContent += '\n' + msg + (obj !== undefined ? ' ' + JSON.stringify(obj) : '');
      } catch {
        box.textContent += '\n' + msg + ' [unserializable]';
      }
      console.log(msg, obj ?? '');
    };
  })();

  window.addEventListener('error', (e) => {
    __dbg('[window.onerror]', { message: e.message, lineno: e.lineno, colno: e.colno });
  });
  window.addEventListener('unhandledrejection', (e) => {
    __dbg('[unhandledrejection]', { reason: (e.reason && e.reason.message) || String(e.reason) });
  });

  let celebrations = [];
  let currentIndex = 0;
  let confettiInterval;
  let rotateInterval;

  const EXIT_AFTER_MS = 30000;   // 30s visning
  const ROTATE_EVERY_MS = 8000;  // bytt hvert 8s
  const CONFETTI_EVERY_MS = 400; // konfetti-rate

  function resolveUrlMaybeRelative(u) {
    try { return new URL(u, window.location.origin).href; } catch { return u; }
  }

  function normalizeCelebrations(raw) {
    __dbg('[normalize] raw length', Array.isArray(raw) ? raw.length : -1);
    if (!Array.isArray(raw)) return [];
    const list = raw.map(c => {
      const image = c.image || c.imageUrl || c.url || c.photo || c.picture || '';
      const heading = c.heading || c.title || c.text || c.name || '';
      return { image: (image || '').toString().trim(), heading: (heading || '').toString().trim() };
    }).filter(c => c.image !== '');
    __dbg('[normalize] normalized length', list.length);
    return list;
  }

  function probeImage(src, timeoutMs = 5000) {
    return new Promise(resolve => {
      const img = new Image();
      let done = false;
      const finish = ok => { if (!done) { done = true; resolve(ok); } };
      const t = setTimeout(() => { __dbg('[probe] timeout', src); finish(false); }, timeoutMs);

      img.onload = () => { clearTimeout(t); __dbg('[probe] ok', src); finish(true); };
      img.onerror = () => { clearTimeout(t); __dbg('[probe] error', src); finish(false); };

      const url = new URL(resolveUrlMaybeRelative(src));
      url.searchParams.set('_t', Date.now().toString());
      img.src = url.href;
      __dbg('[probe] start', url.href);
    });
  }

  async function loadCelebrations() {
    __dbg('[load] fetching /celebrations');
    const url = new URL('/celebrations', location.origin);
    url.searchParams.set('_t', Date.now().toString());
    const res = await fetch(url, { cache: 'no-store' });
    __dbg('[load] http status', res.status);
    const data = await res.json();
    __dbg('[load] raw data', data);

    let list = normalizeCelebrations(data);
    if (!list.length) throw new Error('No celebrations with an image-like field');

    __dbg('[load] probing images...');
    const checks = await Promise.all(list.map(c => probeImage(c.image)));
    list = list.filter((_, i) => checks[i]);

    if (!list.length) throw new Error('No celebrations passed image load check');
    celebrations = list;
    __dbg('[load] celebrations ready', celebrations);
  }

  function showCelebration() {
    const { image, heading } = celebrations[currentIndex];
    const imgEl = document.getElementById('celebrationImage');
    const h1El = document.getElementById('celebrationHeading');

    const url = new URL(resolveUrlMaybeRelative(image));
    url.searchParams.set('_t', Date.now().toString());

    imgEl.src = url.href;
    h1El.textContent = heading || '🎉 Celebration!';
    __dbg('[show] index=' + currentIndex, { image: url.href, heading: h1El.textContent });
  }

  function nextCelebration() {
    currentIndex = (currentIndex + 1) % celebrations.length;
    showCelebration();
  }

  function startConfetti() {
    confettiInterval = setInterval(() => {
      confetti({
        particleCount: 100,
        spread: 100,
        origin: { x: Math.random(), y: Math.random() * 0.6 },
      });
    }, CONFETTI_EVERY_MS);
    __dbg('[confetti] started');
  }

  function safeExit() {
    clearInterval(confettiInterval);
    clearInterval(rotateInterval);
    document.body.classList.add('fade-out');

    __dbg('[exit] returning to index');

    setTimeout(() => {
      const back = document.referrer && new URL(document.referrer).origin === location.origin
        ? document.referrer
        : '/index.html';

      fetch(back, { method: 'HEAD' })
        .then(r => window.location.href = r.ok ? back : '/')
        .catch(() => window.location.href = '/');
    }, 1000);
  }

  async function boot() {
    __dbg('[boot] start');
    try {
      await loadCelebrations();
      showCelebration();
      startConfetti();
      rotateInterval = setInterval(nextCelebration, ROTATE_EVERY_MS);
      setTimeout(safeExit, EXIT_AFTER_MS);
      __dbg('[boot] ready');
    } catch (err) {
      __dbg('[boot] error', { message: err.message });
      console.error('Celebration failed:', err);
      window.location.href = '/';
    }
  }

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') safeExit();
  });

  boot();
</script>


</body>
</html>
