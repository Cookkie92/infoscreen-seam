<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Slide Preview</title>
  <link rel="stylesheet" href="style.css">
  <script src="preview.js" defer></script>
</head>
<body class="infoscreen-page">
  <div class="main-container">
    <button id="backButton" style="font-size:24px; margin: 1rem;">⬅ Back</button>

    <div class="top-section">
      <div class="image-wrapper">
        <img id="slide-image" src="" alt="Slide" />
      </div>

      <div class="text-wrapper">
        <h1 id="slide-heading">Heading here</h1>
        <p id="slide-paragraph">Paragraph text goes here...</p>
      </div>
    </div>
  </div>
</body>
</html>
