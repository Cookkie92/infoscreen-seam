<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Slide Preview</title>
  <link rel="stylesheet" href="style.css">
  <script src="preview.js" defer></script>
</head>
<body class="infoscreen-page">
  <div class="background-circles"></div>

  <div class="main-container">
    <button id="backButton" style="font-size: 20px; margin-bottom: 1rem;">⬅ Back to Admin</button>

    <div class="top-section">
      <div class="image-wrapper">
        <img id="slide-image" src="" alt="Slide" />
      </div>

      <div class="text-wrapper">
        <h1 id="slide-heading">Heading here</h1>
        <p id="slide-paragraph">Paragraph text goes here...</p>
      </div>
    </div>

    <div class="bottom-section">
      <div class="bottom-info">
        <div class="stat-box">
          <p>Sick leave</p>
          <span id="sick-leave">0%</span>
        </div>
        <div class="stat-box">
          <p>Days without injury</p>
          <span id="days-without-injury">0</span>
        </div>
        <div class="stat-box">
          <p>Reporting frequency</p>
          <span id="reporting-frequency">0%</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
