<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Infoscreen</title>
  <link rel="stylesheet" href="style.css" />
  <script src="slideshow.js" defer></script>
</head>
<body class="infoscreen-page">
  <div class="main-container">
    <div class="top-section">
      <div class="image-wrapper">
        <img id="slide-image" src="" alt="Slide" />
      </div>
      
      <div class="text-wrapper">
        <h1 id="slide-heading">Heading here</h1>
        <p id="slide-paragraph">Paragraph text goes here...</p>
      </div>
    </div>

    <div class="bottom-section">
      <div class="bottom-info">
        <p>Sick leave: <span id="sick-leave">0%</span></p>
        <p>Days without injury: <span id="days-without-injury">0</span></p>
        <p>Reporting frequency: <span id="reporting-frequency">0%</span></p>
      </div>
    </div>
  </div>
</body>
</html>
