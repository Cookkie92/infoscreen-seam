<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Infoscreen</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&family=Lobster&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
  <script src="slideshow.js" defer></script>
  <!-- <script src="background.js" defer></script> -->
</head>
<body class="infoscreen-page">
  <!-- Only ONE background container (background.js will fill it) -->
  <div class="background-circles"></div>

  <!-- Loading message -->
  <div id="loadingMessage" style="
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 2rem;
    color: white;
    font-family: 'Roboto', sans-serif;
    z-index: 1000;
  ">
    Laster inn...
  </div>

  <div class="main-container">
    <div class="top-section">
      <div class="image-wrapper">
        <!-- Fallback image for when slideshow.js hasn't loaded yet -->
        <img id="slide-image" src="/default-slide.jpg" alt="Slide" />
      </div>
      
      <div class="text-wrapper" style="display: none;">
        <h1 id="slide-heading"></h1>
        <p id="slide-paragraph"></p>
      </div>
    </div>

    <div class="bottom-section">
      <div class="clock" id="clockDisplay"></div>

      <div class="bottom-info">
        <div class="stat-box">
          <p>Sick leave</p>
          <span id="sick-leave">0%</span>
        </div>
        <div class="stat-box">
          <p>Days without injury</p>
          <span id="days-without-injury">0</span>
        </div>
        <div class="stat-box">
          <p>Reporting frequency</p>
          <span id="reporting-frequency">0%</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
