<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Infoscreen</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&family=Lobster&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <script src="slideshow.js" defer></script>
</head>
<body class="infoscreen-page">

  <div id="loadingMessage" style="
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 2rem;
    color: white;
    font-family: 'Roboto', sans-serif;
    z-index: 1000;">
    Laster inn...
  </div>

  <div class="main-container">
    <div class="top-section">
      <div class="image-wrapper">
        <img id="slide-image" src="/default-slide.jpg" alt="Slide" />
      </div>
      
      <div class="text-wrapper" style="display: none;">
        <h1 id="slide-heading"></h1>
        <p id="slide-paragraph"></p>
      </div>
    </div>

<div class="bottom-section">
  

  <div class="bottom-info combined-layout">
    <!-- 📊 Statistikk -->
    <div class="stat-column">
      <div class="clock" id="clockDisplay"></div>
      <div class="stat-box">
        <p>Sick leave</p>
        <span id="sick-leave">0%</span>
      </div>
      <div class="stat-box">
        <p>Days without injury</p>
        <span id="days-without-injury">0</span>
      </div>
      <div class="stat-box">
        <p>Reporting frequency</p>
        <span id="reporting-frequency">0%</span>
      </div>
      
    </div>

    <!-- 📈 Grafana -->
    <div class="grafana-column">
      <iframe 
        src="http://10.136.167.115/d/Gc0BlsvNk/info-skjerm?orgId=1&from=now-24h&to=now&timezone=browser&refresh=10s&kiosk"
        width="100%" 
        height="100%" 
        style="border: none;">
      </iframe>
    </div>
  </div>
</div>





</body>
</html>
