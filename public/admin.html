<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel - Infoscreen</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&family=Lobster&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="admin-container">

    <h1>Upload New Slide</h1>
    <form id="uploadForm" enctype="multipart/form-data" class="admin-form">
      <label for="image">Image File</label>
      <input type="file" name="image" id="image" required>

      <label for="headerColor">Header Color</label>
      <input type="color" id="headerColor" name="headerColor" value="#ffffff">

      <label for="headerFont">Header Font</label>
      <select id="headerFont">
        <option value="inherit">Default</option>
        <option value="Arial">Arial</option>
        <option value="Georgia">Georgia</option>
        <option value="Courier New">Courier New</option>
        <option value="Times New Roman">Times New Roman</option>
        <option value="'Roboto', sans-serif">Roboto</option>
        <option value="'Lobster', cursive">Lobster</option>
        <option value="'Source Sans 3', sans-serif">Source Sans 3</option>
      </select>

      <label for="headerInput">Slide Header</label>
      <input type="text" id="headerInput" placeholder="Enter a header...">

      <label for="textColor">Text Color</label>
      <input type="color" id="textColor" name="textColor" value="#ffffff">

      <label for="textFont">Text Font</label>
      <select id="textFont">
        <option value="inherit">Default</option>
        <option value="Arial">Arial</option>
        <option value="Georgia">Georgia</option>
        <option value="Courier New">Courier New</option>
        <option value="Times New Roman">Times New Roman</option>
        <option value="'Roboto', sans-serif">Roboto</option>
        <option value="'Lobster', cursive">Lobster</option>
        <option value="'Source Sans 3', sans-serif">Source Sans 3</option>
      </select>

      <label for="textInput">Slide Paragraph Text</label>
      <textarea id="textInput" rows="4" placeholder="Enter paragraph text..."></textarea>

      <button type="submit">Upload Slide</button>
      <button type="button" onclick="window.location.href='/infoscreenpreview.html'">
        Preview All Slides
      </button>

      <p id="status"></p>
    </form>

    <h1>Upload Celebration Slide</h1>
    <form id="celebrationForm" enctype="multipart/form-data" class="admin-form">
      <label for="celebrationImage">Celebration Image</label>
      <input type="file" name="celebrationImage" id="celebrationImage" required>

      <label for="celebrationSound">Celebration Sound (MP3)</label>
      <input type="file" name="celebrationSound" id="celebrationSound" accept="audio/mpeg">

      <label for="celebrationHeading">Celebration Heading</label>
      <input type="text" id="celebrationHeading" name="celebrationHeading" placeholder="e.g. 🎉 Great Job, Team!">

      <button type="submit">Upload Celebration</button>
      <button type="button" id="triggerCelebrationBtn">🎉 Trigger Celebration Now</button>
    </form>

    <!-- ✅ New section to list and delete existing celebrations -->
    <h2>Existing Celebrations</h2>
    <ul id="celebrationList" class="celebration-list"></ul>

    <h1>Update Statistics</h1>
    <form id="statsForm" class="admin-form">
      <label for="sickLeaveInput">Sick Leave (%)</label>
      <input type="text" id="sickLeaveInput" placeholder="Enter sick leave percentage">

      <label for="daysWithoutInjuryInput">Days Without Injury</label>
      <input type="text" id="daysWithoutInjuryInput" placeholder="Enter number of days">

      <label for="reportingFrequencyInput">Reporting Frequency</label>
      <input type="text" id="reportingFrequencyInput" placeholder="Enter reporting frequency">

      <button type="submit">Update Statistics</button>
    </form>

    <h2>Existing Slides</h2>
    <button id="deleteAllBtn" class="delete-all-btn">🗑 Delete All Slides</button>

    <div id="slideList"></div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
